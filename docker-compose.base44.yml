services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    # --no-package-lock: the committed package-lock.json predates main's added
    # devDependencies, and `npm install` rewrites it (npm 10 also prunes other
    # platforms' optional deps) on every start, dirtying the repo. Dependencies
    # install into the node_modules volume; the committed lockfile is untouched.
    command: ["sh", "-ec", "npm install --no-package-lock && exec npm run dev"]
    environment:
      - CHOKIDAR_USEPOLLING=true
    # Probes the running dev server (Vite on 8080), not just the container.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
